services:
  redis:
    image: redis:latest
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    command: --port 6379
  s3:
   image: luofuxiang/local-s3
   healthcheck:
      test: bash -c "[ -f /data/version ]"
      interval: 5s
      timeout: 10s
      start_period: 10s
   configs:
     - target: /data/quarkus.s3.file-delivery-bucket.bucket.meta
       source: config_for_s3
  database:
    image: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    command: -p 5432
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
  keycloak-db:
    image: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    command: -p 5432
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    depends_on:
      keycloak-db:
          condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KC_LOG_CONSOLE_COLOR: true
      KC_LOG_LEVEL: INFO
      KC_HTTP_ACCESS_LOG_ENABLED: true
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8082
      KC_PROXY: edge
      KC_HTTP_ENABLED: false
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_HTTPS_PORT: 443
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/server.key
    command:
      - start
      - --import-realm
    configs:
      - target: /opt/keycloak/data/import/file-delivery.json
        source: config_for_keycloak
      - target: /opt/keycloak/conf/server.crt
        source: config_for_keycloak_crt
      - target: /opt/keycloak/conf/server.key
        source: config_for_keycloak_key
    ports:
      - 8082:443
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  file-delivery-service:
    build:
      context: ../document-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/q/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      keycloak:
        condition: service_healthy
      redis: 
        condition: service_healthy
      database: 
        condition: service_healthy
      s3: 
        condition: service_healthy
    environment:
      FILE_DELIVERY_DOCUMENT_LINK_BASE_URL: https://localhost:8443
      KEYCLOAK_SERVER: "keycloak"
      KEYCLOAK_PORT: 443
      S3_HOST: "s3"
      S3_PORT: 80
      S3_ACCESS_KEY_ID: ${S3_KEY}
      S3_ACCESS_SECRET: ${S3_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: "database"
      DB_PORT: 5432
      DB_USERNAME: ${DATABASE_USER}
      DB_PASSWORD: ${DATABASE_PASSWORD}
      ALLOWED_ORIGINS: https://localhost:8443
      # FORCE THESE OVERRIDES AS NATIVE BUILD IMAGE OPTIMIZATIONS DO NOT RESOLVE 
      # APPLICATION PROPRTIES ON RUNTIME 
      QUARKUS_OIDC_AUTH_SERVER_URL: "https://keycloak:443/realms/file-delivery"
      QUARKUS_OIDC_TOKEN_ISSUER: "https://localhost:8082/realms/file-delivery"
      QUARKUS_OIDC_DISCOVERY_ENABLED: "false"
      QUARKUS_OIDC_JWKS_PATH: "/protocol/openid-connect/certs"
      QUARKUS_OIDC_TLS_VERIFICATION: "none"
      QUARKUS_HTTP_AUTH_PROACTIVE: "false"
      QUARKUS_S3_ENDPOINT_OVERRIDE: http://s3:80
      QUARKUS_S3_AWS_REGION: us-east-1
      QUARKUS_S3_AWS_CREDENTIALS_TYPE: static
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID: ${S3_KEY}
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY: ${S3_SECRET}
      QUARKUS_S3_PATH_STYLE_ACCESS: true
  file-delivery-ui:
    build:
      context: ../UI
    depends_on:
      file-delivery-service:
        condition: service_healthy
    configs:
      - target: /usr/share/nginx/html/config.json
        source: config_for_ui
      - target: /etc/nginx/conf.d/default.conf
        source: config_for_nginx
      - target: /etc/nginx/certs/server.key
        source: config_for_ui_ssl_key
      - target: /etc/nginx/certs/server.crt
        source: config_for_ui_ssl_crt
    ports:
      - 8443:443

configs:
  config_for_s3:
    content: |
      {"objectMap":{},"creationDate":1791780526661,"region":"local","uploads":{},"versioningEnabled":null,"bucketName":"quarkus.s3.file-delivery-bucket","tagging":null,"acl":null,"policy":null,"replication":null,"encryption":null,"publicAccessBlock":null}
  config_for_keycloak:
    file: ./keycloak/file-delivery.json
  config_for_keycloak_crt:
    file: ./secrets/keycloak.crt
  config_for_keycloak_key:
    file: ./secrets/keycloak.key
  config_for_nginx:
    content: |
      server {
          listen       443 ssl;
          listen  [::]:443 ssl;
          server_name  localhost;

          ssl_certificate /etc/nginx/certs/server.crt;
          ssl_certificate_key /etc/nginx/certs/server.key;

          client_max_body_size 50m;

          root /usr/share/nginx/html;
          index index.html;

          location / {
              root   /usr/share/nginx/html;
              index  index.html index.htm;
              try_files $$uri $$uri/ /index.html;
          }

          location /api/ {
              proxy_pass http://file-delivery-service;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
          }

          location /confirm-otp.html {
              proxy_pass http://file-delivery-service;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
          }
      }
  config_for_ui:
    content: |
      {
          "apiBaseUrl": "https://localhost:8443",
          "authBaseUrl": "https://localhost:8082"
      }
  config_for_ui_ssl_key:
    file: ./secrets/ui.key
  config_for_ui_ssl_crt:
    file: ./secrets/ui.crt
