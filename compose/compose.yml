# The following are externally exposed endpoints
# The applation UI            8080
# API service                 8081
# Keycloak                    8082
# S3                          8083

# For access to Keycloak as admin
# username                    security
# password                    sEcur1ty

# The S3 access details as per S3 setup in mounted volume
# access key                  test-key
# access secret               test-secret

# The following are property values that are used by more then one image and need to be consistent
# Database port               5432
# Database                    databasepassword
# Database username           databaseusername
# Redis port                  6379

services:
  redis:
    image: redis:latest
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    command: --port 6379
  s3:
   image: luofuxiang/local-s3
   healthcheck:
      test: bash -c "[ -f /data/version ]"
      interval: 5s
      timeout: 10s
      start_period: 10s
   configs:
     - target: /data/quarkus.s3.file-delivery-bucket.bucket.meta
       source: config_for_s3
  database:
    image: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    command: -p 5432
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: databasepassword
      POSTGRES_USER: databaseusername
  keycloak-db:
    image: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    command: -p 5432
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: kc-db-password
      POSTGRES_USER: kc-db-user
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    depends_on:
      keycloak-db:
          condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: security
      KC_BOOTSTRAP_ADMIN_PASSWORD: sEcur1ty
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KC_LOG_CONSOLE_COLOR: true
      KC_LOG_LEVEL: INFO
      KC_HTTP_ACCESS_LOG_ENABLED: true
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: kc-db-user
      KC_DB_PASSWORD: kc-db-password
    command: -v start-dev --import-realm
    configs:
      - target: /opt/keycloak/data/import/file-delivery.json
        source: config_for_keycloak
    ports:
      - 8082:8080
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  file-delivery-service:
    image: filedelivery-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/q/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      keycloak:
        condition: service_healthy
      redis: 
        condition: service_healthy
      database: 
        condition: service_healthy
      s3: 
        condition: service_healthy
    environment:
      FILE_DILEVERY_SERVER_HOST: "localhost"
      FILE_DILEVERY_SERVER_PORT: 8080
      KEYCLOAK_SERVER: "keycloak"
      KEYCLOAK_PORT: 8080
      S3_HOST: "s3"
      S3_PORT: 80
      S3_ACCESS_KEY_ID: test-key
      S3_ACCESS_SECRET: test-secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: "database"
      DB_PORT: 5432
      DB_USERNAME: databaseusername
      DB_PASSWORD: databasepassword
      # FORCE THESE OVERRIDES AS NATIVE BUILD IMAGE OPTIMIZATIONS DO NOT RESOLVE 
      # APPLICATION PROPRTIES ON RUNTIME 
      QUARKUS_OIDC_AUTH_SERVER_URL: "http://keycloak:8080/realms/file-delivery"
      QUARKUS_OIDC_TOKEN_ISSUER: "http://localhost:8082/realms/file-delivery"
      QUARKUS_OIDC_DISCOVERY_ENABLED: "false"
      QUARKUS_OIDC_JWKS_PATH: "/protocol/openid-connect/certs"
      QUARKUS_HTTP_AUTH_PROACTIVE: "false"
      QUARKUS_S3_ENDPOINT_OVERRIDE: http://s3:80
      QUARKUS_S3_AWS_REGION: us-east-1
      QUARKUS_S3_AWS_CREDENTIALS_TYPE: static
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID: test-key
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY: test-secret
      QUARKUS_S3_PATH_STYLE_ACCESS: true
    ports:
      - 8081:80
  file-delivery-ui:
    image: file-delivery-ui:latest
    depends_on:
      file-delivery-service:
        condition: service_healthy
    configs:
      - target: /usr/share/nginx/html/config.json
        source: config_for_ui
      - target: /etc/nginx/conf.d/default.conf
        source: config_for_nginx
    ports:
      - 8080:80

configs:
  config_for_s3:
    content: |
      {"objectMap":{},"creationDate":1791780526661,"region":"local","uploads":{},"versioningEnabled":null,"bucketName":"quarkus.s3.file-delivery-bucket","tagging":null,"acl":null,"policy":null,"replication":null,"encryption":null,"publicAccessBlock":null}
  config_for_keycloak:
    file: ./keycloak/file-delivery.json
  config_for_nginx:
    content: |
      server {
          listen       80;
          listen  [::]:80;
          server_name  localhost;

          root /usr/share/nginx/html;
          index index.html;

          location / {
              root   /usr/share/nginx/html;
              index  index.html index.htm;
          }

          location /api/ {
              proxy_pass http://file-delivery-service;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }
      }
  config_for_ui:
    content: |
      {
          "apiBaseUrl": "http://localhost:8080",
          "authBaseUrl": "http://localhost:8082"
      }
