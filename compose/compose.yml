services:
  redis:
    image: redis:latest
    command: --port ${REDIS_PORT}
  database:
    image: postgres
    command: -p ${DB_PORT}
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: -v start-dev --import-realm
    volumes:
      - ./keycloak/file-delivery.json:/opt/keycloak/data/import/file-delivery.json
  s3:
    image: luofuxiang/local-s3
    volumes:
      - ./s3/data:/data
  file-delivery-service:
    image: tseliso/document-service:1.0.0-SNAPSHOT
    depends_on:
      - redis
      - database
      - keycloak
      - s3
    environment:
      FILE_DILEVERY_SERVER_HOST: "file-delivery-service"
      FILE_DILEVERY_SERVER_PORT: ${FILE_DILEVERY_SERVER_PORT}
      KEYCLOAK_SERVER: "keycloak"
      KEYCLOAK_PORT: 8080
      S3_HOST: "s3"
      S3_PORT: 4566
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_ACCESS_SECRET: ${S3_ACCESS_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      DB_HOST: "database"
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
  file-delivery-ui:
    image: file-delivery-ui:latest
    depends_on:
      - file-delivery-service
    ports:
      - 8085:80
