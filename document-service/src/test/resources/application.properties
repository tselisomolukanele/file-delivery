quarkus.http.port=0
quarkus.http.test-port=0

quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=test-access-key
quarkus.s3.aws.credentials.static-provider.secret-access-key=test-secret-key
quarkus.s3.aws.credentials.static-provider.access-key-id=test-key
quarkus.s3.aws.credentials.static-provider.secret-access-key=test-secret

quarkus.datasource.db-kind=h2
quarkus.datasource.username=username-default
quarkus.datasource.jdbc.url=jdbc:h2:mem:default;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE

quarkus.oidc.tenant-enabled=false