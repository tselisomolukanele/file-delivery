resolved.document.link.base.url=${FILE_DELIVERY_DOCUMENT_LINK_BASE_URL:http://localhost:8081}
resolved.allowed.origins=${ALLOWED_ORIGINS:https://localhost:8443, http://localhost:4200}

resolved.keycloak.server=${KEYCLOAK_SERVER:localhost}
resolved.keycloak.port=${KEYCLOAK_PORT:8080}

resolved.s3.host=${S3_HOST:localhost}
resolved.s3.port=${S3_PORT:4566}
resolved.s3.access.key.id=${S3_ACCESS_KEY_ID}
resolved.s3.access.secret=${S3_ACCESS_SECRET}

resolved.redis.host=${REDIS_HOST:localhost}
resolved.redis.port=${REDIS_PORT:6379}

resolved.db.host=${DB_HOST:localhost}
resolved.db.port=${DB_PORT:5433}
resolved.db.username=${DB_USERNAME}
resolved.db.password=${DB_PASSWORD}

quarkus.http.port=80

# Allowed origins
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${ALLOWED_ORIGINS}
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, OPTIONS, HEAD, PUT, POST

# Keycloak OIDC validation
quarkus.oidc.auth-server-url=http://${resolved.keycloak.server}:${resolved.keycloak.port}/realms/file-delivery
quarkus.oidc.client-id=file-delivery-ui
quarkus.oidc.application-type=service

# Point Quarkus to the nested realm-access roles claim
quarkus.oidc.roles.source=accesstoken

# Allow options
quarkus.http.auth.permission.cors-preflight.paths=/api/*
quarkus.http.auth.permission.cors-preflight.policy=permit
quarkus.http.auth.permission.cors-preflight.methods=OPTIONS

# Require JWT for all /api endpoints
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Make upload link public as token specific auth is implemented in the service layer
quarkus.http.auth.permission.public.paths=/api/document/download/*                            
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.public.methods=GET

# This is purely for simulation purposes and does not make part of the core application logic
quarkus.http.auth.permission.email.paths=api/email/document-link                        
quarkus.http.auth.permission.email.policy=permit
quarkus.http.auth.permission.email.methods=GET

# Optional Swagger UI access if you want to inspect the API locally
quarkus.swagger-ui.always-include=false

quarkus.s3.endpoint-override=http://${resolved.s3.host}:${resolved.s3.port}

quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${resolved.s3.access.key.id}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${resolved.s3.access.secret}

bucket.name=quarkus.s3.file-delivery-bucket
quarkus.s3.devservices.buckets=${bucket.name}

document.link.base.url=${resolved.document.link.base.url}

quarkus.redis.hosts=redis://${resolved.redis.host}:${resolved.redis.port}

# Database
quarkus.datasource.db-kind=postgresql 
quarkus.datasource.username=${resolved.db.username}
quarkus.datasource.password=${resolved.db.password}
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.datasource.jdbc.url=jdbc:postgresql://${resolved.db.host}:${resolved.db.port}/postgres
quarkus.datasource.jdbc.max-size=16

quarkus.flyway.migrate-at-start=true

# in seconds
token.ttl=600

# rate limiting: 60 requests per minute per client
rate.limit.capacity=60
rate.limit.refill-duration-seconds=60