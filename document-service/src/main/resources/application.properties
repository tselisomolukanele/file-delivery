quarkus.http.host=0.0.0.0

# Enable CORS globally
quarkus.http.cors=true

# Allow all origins, methods, and headers
quarkus.http.cors.origins=*
quarkus.http.cors.methods=*
quarkus.http.cors.headers=*

# Keycloak OIDC validation
quarkus.oidc.auth-server-url=http://localhost:8080/realms/file-delivery
quarkus.oidc.client-id=file-delivery-ui
quarkus.oidc.application-type=service

# Point Quarkus to the nested realm-access roles claim
quarkus.oidc.roles.role-channels.path=realm_access/roles
quarkus.oidc.roles.source=accesstoken

# Allow options
quarkus.http.auth.permission.cors-preflight.paths=/api/*, /document/*
quarkus.http.auth.permission.cors-preflight.policy=permit
quarkus.http.auth.permission.cors-preflight.methods=OPTIONS

# Require JWT for all /api endpoints
quarkus.http.auth.permission.authenticated.paths=/api/*,/document/upload
quarkus.http.auth.permission.authenticated.policy=authenticated

# Make upload link public as token specific auth is implemented in the service layer
quarkus.http.auth.permission.public.paths=/document/download/*                            
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.public.methods=GET

# Optional Swagger UI access if you want to inspect the API locally
quarkus.swagger-ui.always-include=true

quarkus.s3.endpoint-override=http://localhost:4566

quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=test-key
quarkus.s3.aws.credentials.static-provider.secret-access-key=test-secret

bucket.name=quarkus.s3.file-delivery-bucket
quarkus.s3.devservices.buckets=${bucket.name}

host.base.url=http://localhost:8081

quarkus.redis.hosts=redis://localhost:6379

# In-memory database used for the Customer / Document persistence model
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:document-service;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Database
quarkus.datasource.db-kind=postgresql 
quarkus.datasource.username=postgres
quarkus.datasource.password=mysecretpassword

quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/postgres
quarkus.datasource.jdbc.max-size=16