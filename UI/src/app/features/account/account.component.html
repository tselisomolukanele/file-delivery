<section class="page-shell">
  <div class="page-header">
    <p class="eyebrow">Client profile</p>
    <h1>My account</h1>
  </div>

  <div class="profile-card" *ngIf="user() as currentUser; else signedOut">
    <div class="avatar" aria-label="User avatar">{{ currentUser.avatar }}</div>

    <div class="profile-body">
      <h2>{{ currentUser.name }}</h2>
      <p class="muted">{{ currentUser.email }}</p>

      <dl>
        <div>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Download</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let document of documents()">
                <td>{{ document.name }}</td>
                <td><a href="{{ document.link }}" target="_blank">Download</a></td>
                <td><button (click)="goToLink(document)">Email</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </dl>


    </div>
  </div>

  <ng-template #signedOut>
    <div class="empty-state">
      <h2>Profile unavailable</h2>
      <p>Please sign in to view your account information.</p>
      <a routerLink="/" class="primary-link">Back to home</a>
    </div>
  </ng-template>
</section>
