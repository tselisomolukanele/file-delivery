<section class="hero">
  <div class="hero-copy">
    <p class="eyebrow">Secure delivery workspace</p>

    <div class="cta-group" *ngIf="!user(); else loggedInBanner">
      <button type="button" class="ghost" (click)="login()">Sign in</button>
    </div>

    <ng-template #loggedInBanner>
      <div class="logged-in-panel">
        <h2>Welcome back, {{ user()?.name }}</h2>
        <div class="cta-group compact">
          <a *ngIf="user()?.roles.includes('file-owner')" routerLink="/account" class="primary">Open account</a>
          <a *ngIf="user()?.roles.includes('file-uploader')" routerLink="/accounts" class="primary">View users</a>
          <button type="button" class="secondary" (click)="logout()">Log out</button>
        </div>
      </div>
    </ng-template>
  </div>

  <div class="hero-card">
    <div class="mini-card">
      <span class="status-dot"></span>
      <div>
        <small>System status</small>
        <strong>Healthy</strong>
      </div>
    </div>
  </div>
</section>
