<section class="page-shell">
  <div class="page-header">
    <p class="eyebrow">Admin access</p>
    <h1>Customers</h1>
  </div>

  <div class="table-card" style="margin-top: 2rem;">
    <h2>Customers</h2>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Upload</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let profile of documentProfiles()">
          <td>{{ profile.name }}</td>
          <td>
              <input type="file" class="file-input" (change)="onFileSelected(profile.name, $event)" #fileUpload>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="table-card" style="margin-top: 2rem;">
    <h2>New Customer</h2>
    <form [formGroup]="customerForm" (ngSubmit)="onFormSubmit()">
      <label for="first-name">Name: </label>
      <input placeholder="Name" formControlName="name">
      <button type="submit" [disabled]="!customerForm.valid">New Customer</button>
    </form>
  </div>

</section>
