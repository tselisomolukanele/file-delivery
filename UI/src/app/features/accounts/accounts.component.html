<section class="page-shell">
  <div class="page-header">
    <p class="eyebrow">Admin access</p>
    <h1>Accounts</h1>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>User</th>
          <th>Role</th>
          <th>Company</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td class="user-cell">
            <div class="avatar">{{ user.avatar }}</div>
            <div>
              <strong>{{ user.name }}</strong>
              <span>{{ user.email }}</span>
            </div>
          </td>
          <td>
            <span class="role-badge" [class.client]="user.roles.includes('file-owner')">
              Client
            </span>
            <span class="role-badge" [class.admin]="user.roles.includes('file-uploader')">
              Admin
            </span>
          </td>
          <td>{{ user.company }}</td>
          <td>{{ user.status }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="table-card" style="margin-top: 2rem;">
    <h2>Document Service</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let profile of documentProfiles()">
          <td>{{ profile }}</td>
          <td>
              <input type="file" class="file-input" (change)="onFileSelected($event)" #fileUpload>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
