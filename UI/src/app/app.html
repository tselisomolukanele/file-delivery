<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/">FileDelivery</a>

    <nav class="nav" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a *ngIf="user()?.roles.includes('file-owner')" routerLink="/account" routerLinkActive="active">Account</a>
      <a *ngIf="user()?.roles.includes('file-uploader')" routerLink="/accounts" routerLinkActive="active">Accounts</a>
    </nav>

    <div class="header-actions">
      <ng-container *ngIf="!user(); else signedIn">
        <button type="button" class="cmd-btn alt" (click)="login()">Sign in</button>
      </ng-container>

      <ng-template #signedIn>
        <span class="user-pill">{{ user()?.name }}</span>
        <button type="button" class="cmd-btn" (click)="logout()">Log out</button>
      </ng-template>
    </div>
  </header>

  <main class="main-content">
    <router-outlet />
  </main>
</div>
